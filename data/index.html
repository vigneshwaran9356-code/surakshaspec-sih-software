<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b36">
  <title>FeedTest</title>
  <style>
    :root { color-scheme: light dark; --bg: #f2f6f2; --panel: #fff; --ink: #10231f; --muted: #5b6b66; --line: #cbd8d2; --accent: #0d6b5c; --good: #176b3a; --bad: #a13a25; }
    @media (prefers-color-scheme: dark) { :root { --bg: #10201d; --panel: #18302b; --ink: #f2f7f4; --muted: #b5c5bf; --line: #38534b; --accent: #75d1b9; --good: #8ee5a5; --bad: #ff9a7d; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans Tamil", "Noto Sans Devanagari", system-ui, sans-serif; line-height: 1.5; }
    main { width: min(100% - 2rem, 42rem); margin: auto; padding: 1rem 0 2rem; }
    main.dashboard-hidden > :not(#welcome) { display: none; }
    .welcome { min-height: 80vh; display: grid; align-content: center; gap: 1rem; text-align: center; }
    .welcome.leaving { animation: welcome-out .35s ease forwards; }
    main.dashboard-enter > :not(#welcome) { animation: dashboard-in .45s ease both; }
    @keyframes welcome-out { to { opacity: 0; transform: translateY(-1rem); } }
    @keyframes dashboard-in { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .welcome.leaving, main.dashboard-enter > :not(#welcome) { animation: none; } }
    .welcome-mark { width: 5rem; height: 5rem; display: grid; place-items: center; margin: auto; border-radius: 1.2rem; background: var(--accent); color: #fff; font-size: 2.5rem; font-weight: 800; }
    .welcome h1 { font-size: 2.5rem; }
    .welcome button { width: 100%; max-width: 20rem; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
    h1 { margin: 0; font-size: 2rem; letter-spacing: 0; }
    h2 { margin: 0; font-size: 1.2rem; }
    p { margin: .45rem 0; }
    .subtitle, .help, .meta { color: var(--muted); }
    select { min-height: 2.75rem; border: 2px solid var(--line); border-radius: .5rem; padding: .4rem; background: var(--panel); color: var(--ink); font: inherit; }
    .status { display: grid; grid-template-columns: auto 1fr; gap: .15rem .6rem; margin: 1rem 0; padding: .9rem; border: 2px solid var(--line); border-radius: .6rem; background: var(--panel); font-weight: 700; }
    .status .meta { grid-column: 2; font-size: .85rem; font-weight: 500; }
    .dot { width: .75rem; height: .75rem; border-radius: 50%; background: var(--bad); }
    .dot.on { background: var(--good); }
    .panel { margin-top: 1rem; padding: 1rem; border: 2px solid var(--line); border-radius: .6rem; background: var(--panel); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .75rem; margin-top: .8rem; }
    .tile { min-height: 7rem; padding: .8rem; border: 2px solid var(--line); border-radius: .5rem; }
    .tile-name { color: var(--muted); font-size: .95rem; }
    .tile-value { margin-top: .4rem; font-size: 1.55rem; font-weight: 800; }
    .empty { color: var(--muted); }
    .stale { color: var(--bad); }
    .controls { display: grid; gap: .7rem; }
    .controls label { font-weight: 700; }
    .controls select { width: 100%; }
    button { min-height: 2.75rem; padding: .5rem .85rem; border: 0; border-radius: .5rem; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    .voice-controls { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
    .voice-controls button { min-width: 0; }
    .voice-settings { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; align-items: end; }
    .voice-settings label { display: grid; gap: .25rem; }
    .voice-settings input[type="checkbox"] { width: 1.2rem; height: 1.2rem; }
    .feedback { position: fixed; z-index: 10; left: 1rem; right: 1rem; bottom: 1rem; display: none; padding: .85rem 1rem; border-radius: .6rem; background: var(--accent); color: #fff; text-align: center; font-weight: 700; box-shadow: 0 4px 16px rgba(0, 0, 0, .2); }
    .feedback.visible { display: block; }
    .feedback.error { background: var(--bad); }
    .result-good { color: var(--good); }
    .result-moderate, .result-poor, .result-unsafe { color: var(--bad); }
    ul { margin: .5rem 0 0; padding-left: 1.3rem; }
    canvas { display: block; width: 100%; height: 12rem; margin-top: .8rem; border: 2px solid var(--line); border-radius: .5rem; background: var(--bg); }
  </style>
</head>
<body>
  <main class="dashboard-hidden">
    <section class="welcome" id="welcome">
      <div class="welcome-mark" aria-hidden="true">F</div>
      <div><h1 id="welcomeTitle">FeedTest</h1><p class="subtitle" id="welcomeSubtitle"></p></div>
      <p class="help" id="welcomeHelp"></p>
      <button id="startTesting" type="button"></button>
    </section>
    <header>
      <div><h1 id="title">FeedTest</h1><p class="subtitle" id="subtitle"></p></div>
      <label><span id="languageLabel"></span><br><select id="language"><option value="en">English</option><option value="ta">தமிழ்</option><option value="hi">हिन्दी</option></select></label>
    </header>
    <p class="help" id="help"></p>
    <section class="status" aria-live="polite"><span class="dot" id="dot"></span><span id="connection"></span><span class="meta" id="lastUpdate"></span></section>
    <section class="panel"><h2 id="readingsHeading"></h2><div class="tiles" id="tiles"></div><p class="empty" id="empty"></p></section>
    <section class="panel controls">
      <label for="feedType" id="feedTypeLabel"></label>
      <select id="feedType"><option value="pellet">Pellet</option><option value="mash">Mash</option><option value="silage">Silage</option><option value="mineral">Mineral mixture</option></select>
      <button id="checkQuality" type="button"></button>
      <div class="voice-controls"><button id="speakResult" type="button"></button><button id="testVoice" type="button">Test voice</button></div>
      <div class="voice-settings"><label><span>Mute voice</span><input id="muteVoice" type="checkbox"></label><label for="voiceRate">Voice speed<select id="voiceRate"><option value="0.8">0.8x</option><option value="1" selected>1x</option><option value="1.2">1.2x</option></select></label></div>
      <button id="exportCsv" type="button"></button>
    </section>
    <section class="panel"><h2 id="historyHeading"></h2><canvas id="chart" width="640" height="240"></canvas><p class="meta" id="historyCount"></p></section>
    <section class="panel" id="resultPanel" hidden aria-live="polite"><h2 id="resultQuality"></h2><p id="resultAdvice"></p><p id="resultCoverage"></p><h3 id="problemsHeading"></h3><ul id="problems"></ul><h3 id="checksHeading"></h3><ul id="checksDone"></ul><h3 id="missingHeading"></h3><ul id="checksMissing"></ul></section>
  </main>

      var latest = loadLastReading();

        document.getElementById("dot").className = receivedAt ? "dot on" : "dot";
        var tiles = document.getElementById("tiles");

        });
        document.getElementById("empty").textContent = count ? "" : t.noSensors;

      }
      function loadHistory() { try { var saved = JSON.parse(localStorage.getItem("feedtest-readings") || "[]"); return Array.isArray(saved) ? saved : []; } catch (error) { return []; } }
      function loadLastReading() { try { var saved = JSON.parse(localStorage.getItem("feedtest-last-reading") || "null"); return saved && typeof saved === "object" ? saved : null; } catch (error) { return null; } }
      function saveReading(data) {

        history.push({ timestamp: new Date().toISOString(), ms: data.ms, readings: data });
        history = history.slice(-360);
        try {
          localStorage.setItem("feedtest-readings", JSON.stringify(history));
          localStorage.setItem("feedtest-last-reading", JSON.stringify(data));
        } catch (error) { history = history.slice(-60); }
      }
      function drawChart() {

        keys.forEach(function (key, index) { var measured = points.map(function (point) { return point.readings[key]; }).filter(function (value) { return typeof value === "number"; }); if (!measured.length) return; context.strokeStyle = colors[index]; context.lineWidth = 3; context.beginPath(); measured.forEach(function (value, pointIndex) { var x = points.length < 2 ? width / 2 : pointIndex * width / (points.length - 1); var y = height - ((value - min) / (max - min)) * height; if (pointIndex) context.lineTo(x, y); else context.moveTo(x, y); }); context.stroke(); });

      }
      function exportCsv() {

      }
      function evaluate(readings) {

      }
      function list(parent, items) { parent.textContent = ""; items.forEach(function (item) { var li = document.createElement("li"); li.textContent = item; parent.appendChild(li); }); }
      function openDashboard() {
        var main = document.querySelector("main");
        var welcome = document.getElementById("welcome");

        welcome.classList.add("leaving");

          welcome.hidden = true;
          welcome.classList.remove("leaving");
          main.classList.remove("dashboard-enter");
          window.scrollTo(0, 0);
        }, 350);
      }
      function renderResult() {
        var t = text(); var panel = document.getElementById("resultPanel"); panel.hidden = false;
        var quality = document.getElementById("resultQuality"); quality.textContent = result.quality || t.noReadings; quality.className = result.quality ? "result-" + result.quality.toLowerCase() : "stale";
        document.getElementById("resultAdvice").textContent = result.quality === "Good" ? t.noProblem : result.quality ? t.limitedAdvice : t.noReadings;
        document.getElementById("resultCoverage").textContent = result.quality ? t.basedOn + " " + result.measured + " " + t.of + " " + result.possible + " " + t.sensorReadings + (result.limited ? " - " + t.limited : "") : "";

        list(document.getElementById("checksDone"), result.done);
        list(document.getElementById("checksMissing"), result.missing);
      }
      function loadVoiceSetting(key, fallback) { try { var value = localStorage.getItem(key); return value === null ? fallback : JSON.parse(value); } catch (error) { return fallback; } }
      function saveVoiceSetting(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) {} }
      function buildVoiceSentence(current) {
        if (!current || !Number.isFinite(current.measured) || current.measured < 1 || !current.quality) return "";
        var voice = voiceText[language.value] || voiceText.en;
        var parts = [voice.quality[current.quality] || current.quality];

      function unlockAudio() { if (!audioContext && window.AudioContext) audioContext = new AudioContext(); if (audioContext && audioContext.state === "suspended") audioContext.resume(); }

      function speakAutomaticAlert(current) {

        });

      }

      document.getElementById("checkQuality").addEventListener("click", function () {

      });

      document.getElementById("testVoice").addEventListener("click", function () {

        speakResult(false);
      });
      document.getElementById("muteVoice").addEventListener("change", function () { muted = this.checked; saveVoiceSetting("feedtest-voice-muted", muted); });

        var ageText = receivedAt ? t.lastUpdate + ": " + age + " " + t.secondsAgo : t.readingBoard;
        var stale = receivedAt && age > 5;
        document.getElementById("lastUpdate").textContent = stale ? ageText + " - " + t.stale : ageText;
        document.getElementById("lastUpdate").className = stale ? "meta stale" : "meta";
      }
